<!DOCTYPE html>
<html>
<head>
  <title>Add Drink</title>
  <style>
    .autocomplete { position: relative; display: inline-block; }
    .autocomplete-items {
      position: absolute;
      border: 1px solid #d4d4d4;
      z-index: 99;
      top: 100%; left: 0; right: 0;
    }
    .autocomplete-items div {
      padding: 10px;
      background: #fff;
      cursor: pointer;
    }
    .autocomplete-items div:hover {
      background: #e9e9e9;
    }
  </style>
</head>
<body>

<h2>Add a Drink</h2>

<form action="/add" method="POST" autocomplete="off">
  <div class="autocomplete" style="width:300px;">
    <input id="flavourInput" type="text" name="flavour" placeholder="Enter flavour" required>
  </div>
  <input type="submit" value="Add Drink">
</form>

<script>
function autocomplete(inp, arr) {
  let currentFocus;
  inp.addEventListener("input", function(e) {
    let a, b, i, val = this.value;
    closeAllLists();
    if (!val) return false;
    currentFocus = -1;

    a = document.createElement("DIV");
    a.setAttribute("id", this.id + "autocomplete-list");
    a.setAttribute("class", "autocomplete-items");
    this.parentNode.appendChild(a);

    for (i = 0; i < arr.length; i++) {
      if (arr[i].toLowerCase().includes(val.toLowerCase())) {
        b = document.createElement("DIV");
        b.innerHTML = "<strong>" + arr[i].substr(0, val.length) + "</strong>";
        b.innerHTML += arr[i].substr(val.length);
        b.innerHTML += "<input type='hidden' value='" + arr[i] + "'>";
        b.addEventListener("click", function(e) {
          inp.value = this.getElementsByTagName("input")[0].value;
          closeAllLists();
        });
        a.appendChild(b);
      }
    }
  });

  function closeAllLists(elmnt) {
    const items = document.getElementsByClassName("autocomplete-items");
    for (let i = 0; i < items.length; i++) {
      if (elmnt != items[i] && elmnt != inp) items[i].parentNode.removeChild(items[i]);
    }
  }

  document.addEventListener("click", function (e) {
    closeAllLists(e.target);
  });
}

fetch("/stats")
  .then(response => response.json())
  .then(data => autocomplete(document.getElementById("flavourInput"), data));
</script>

</body>
</html>
